<body class="bg-surface text-on-surface font-body-lg min-h-screen relative pb-32">
<!-- Transactional Top App Bar (Adapted from TopAppBar JSON for a sub-page) -->
<header class="flex items-center justify-between px-container-padding w-full h-16 bg-surface sticky top-0 z-40 transition-colors duration-200 flat no shadows">
<div class="flex items-center">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="ml-2 font-headline-md text-headline-md text-primary flex items-center gap-2"><span class="">Magangku</span><span class="text-on-surface-variant font-body-md">|</span><span class="">Tambah Sekolah</span></h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-container-padding pt-stack-sm pb-stack-lg max-w-2xl mx-auto w-full">
<form action="#" class="flex flex-col gap-stack-lg mt-stack-md" method="POST">
<!-- Context/Instructions (Optional, enhances UX) -->
<div class="bg-surface-container-low p-4 rounded-xl border border-outline-variant/30">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Silakan masukkan informasi detail mengenai institusi pendidikan baru. Pastikan data yang dimasukkan akurat untuk keperluan administrasi pusat.
                </p>
</div>
<fieldset class="flex flex-col gap-stack-md">
<!-- Field: Nama Sekolah -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="nama_sekolah">Nama Sekolah</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">school</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-lg pl-10 pr-3 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" id="nama_sekolah" name="nama_sekolah" placeholder="Contoh: SMA Negeri 1 Jakarta" required="" type="text">
</div>
</div>
<!-- Field: Domisili -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="domisili">Domisili (Alamat Lengkap)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3 text-outline" style="font-size: 20px;">location_on</span>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-lg pl-10 pr-3 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm resize-none" id="domisili" name="domisili" placeholder="Masukkan alamat lengkap beserta kota dan kode pos..." required="" rows="3"></textarea>
</div>
</div>
<!-- Field: No HP Sekolah -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="no_hp">No HP / Telepon Sekolah</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">call</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-lg pl-10 pr-3 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" id="no_hp" name="no_hp" placeholder="Contoh: 021-1234567" required="" type="tel">
</div>
</div>
</fieldset>
</form>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant shadow-sm px-container-padding py-4 flex gap-stack-md justify-end items-center max-w-2xl mx-auto right-0">
<button class="flex-1 md:flex-none px-6 py-3 bg-surface-container-high text-on-surface-variant rounded-lg font-interactive text-interactive text-center hover:bg-secondary-fixed transition-colors" type="button">
            Batal
        </button>
<button class="flex-1 md:flex-none px-6 py-3 bg-primary text-on-primary rounded-lg font-interactive text-interactive text-center hover:bg-primary/90 transition-colors shadow-sm flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined" style="font-size: 20px;">save</span>
